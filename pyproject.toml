[build-system]
requires = [
  "setuptools>=61.0"
]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# Real suite only; scratch / live-served fixtures under test-dir are not tests.
testpaths = ["dev_src/tests"]
pythonpath = ["dev_src"]
norecursedirs = ["test-dir", ".*", "build", "dist", "venv", ".venv", "__pycache__"]

[tool.ruff]
# Dev tree only; archived / shipped trees are out of scope for this pass.
exclude = [
  "src",
  "local_server (py~3.4).py",
  "dev_src/test-dir",
  "**/__pycache__",
  ".venv",
  "venv",
]
target-version = "py38"
line-length = 120

[tool.ruff.lint]
# Prefer Union/Optional over | for 3.8; keep serious checks only.
select = [
  "E9",   # runtime syntax
  "F63",  # invalid print/assert
  "F7",   # syntax errors
  "F82",  # undefined names
  "E71",  # comparison to True/False/None
]
ignore = [
  "E741",  # ambiguous variable names (legacy code)
]
